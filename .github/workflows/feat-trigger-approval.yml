name: Workflow Sync Feature

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: read

jobs:
  pr-approval-check:
    if: |
      github.event.review.state == 'approved' &&
      (
        github.event.pull_request.base.ref == 'develop' ||
        startsWith(github.event.pull_request.base.ref, 'develop-p')
      ) &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'feature-p')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Generate Org GitHub App token
        id: generate_org_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          
      - name: Check approvals from required teams
        env:
          GH_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ steps.generate_org_token.outputs.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          ORG=${{ github.repository_owner }}

          set -euo pipefail

          DEVOPS_TEAMS=("tsep-by-devops" "tsep-by-developers")
          CAR1B_TEAMS=("tsep-by-car1b-dev")

          APPROVED_USERS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews \
            --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | .[]')

          DEVOPS_APPROVER=""
          CAR1B_APPROVER=""

          is_team_member() {
            local team=$1
            local user=$2
            GH_TOKEN="$ORG_TOKEN" gh api "orgs/$ORG/teams/$team/memberships/$user" --jq '.state' 2>/dev/null
          }

          for USER in $APPROVED_USERS; do
            IN_DEVOPS_TEAM=false
            IN_CAR1B_TEAM=false

            for TEAM in "${DEVOPS_TEAMS[@]}"; do
              if [ "$(is_team_member "$TEAM" "$USER")" == "active" ]; then
                IN_DEVOPS_TEAM=true
                break
              fi
            done

            for TEAM in "${CAR1B_TEAMS[@]}"; do
              if [ "$(is_team_member "$TEAM" "$USER")" == "active" ]; then
                IN_CAR1B_TEAM=true
                break
              fi
            done

            echo "$USER => devops/developers:$IN_DEVOPS_TEAM car1b-developers:$IN_CAR1B_TEAM"

            if [ "$IN_DEVOPS_TEAM" == "true" ] && [ -z "$DEVOPS_APPROVER" ]; then
              DEVOPS_APPROVER="$USER"
            elif [ "$IN_CAR1B_TEAM" == "true" ] && [ -z "$CAR1B_APPROVER" ]; then
              CAR1B_APPROVER="$USER"
            fi
          done

          echo "Devops/developers approver: ${DEVOPS_APPROVER:-none}"
          echo "Car1b-developers approver: ${CAR1B_APPROVER:-none}"

          if [ -z "$DEVOPS_APPROVER" ] || [ -z "$CAR1B_APPROVER" ]; then
            echo "::error::Required approvals missing. Need 1 approval from tsep-by-wms-devops/tsep-by-wms-developers AND 1 approval from tsep-by-wms-car1b-developers."
            exit 1
          fi
          
      - name: Validate branch mapping
        run: |
          set -euo pipefail

          EXPECTED_BASE=""

          # Standard feature branch
          if [[ "$HEAD_REF" =~ ^feature/[^/]+$ ]]; then
            EXPECTED_BASE="develop"

          # Variant feature branch
          elif [[ "$HEAD_REF" =~ ^feature-(p[0-9]+)/[^/]+$ ]]; then
            VARIANT="${BASH_REMATCH[1]}"
            EXPECTED_BASE="develop-${VARIANT}"

          else
            echo "::error::Invalid source branch '$HEAD_REF'."
            echo "::error::Allowed patterns:"
            echo "::error::  feature/<name>"
            echo "::error::  feature-p<n>/<name>"
            exit 1
          fi

          echo "Source branch  : $HEAD_REF"
          echo "Target branch  : $BASE_REF"
          echo "Expected target: $EXPECTED_BASE"

          # -----------------------------------------------------
          # Validate source -> target relationship
          # -----------------------------------------------------
          if [[ "$BASE_REF" != "$EXPECTED_BASE" ]]; then
            echo "::error::Invalid branch mapping."
            echo "::error::Source branch : $HEAD_REF"
            echo "::error::Target branch : $BASE_REF"
            echo "::error::Expected     : $EXPECTED_BASE"
            exit 1
          fi

          # -----------------------------------------------------
          # Validate allowed target branch taxonomy
          # -----------------------------------------------------
          if [[ "$BASE_REF" != "develop" ]] &&
             ! [[ "$BASE_REF" =~ ^develop-p[0-9]+$ ]]; then

            echo "::error::Invalid target branch '$BASE_REF'."
            echo "::error::Allowed target patterns:"
            echo "::error::  develop"
            echo "::error::  develop-p<n>"
            exit 1
          fi

          echo ""
          echo "Branch mapping validation successful."
          echo "$HEAD_REF -> $BASE_REF"
          
      # Checkout the PR HEAD commit explicitly
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Create BYReady tag
      - name: Create BYReady Tag
        run: |
          git fetch --tags

          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING_COUNT=$(git tag -l "${BRANCH_NAME}-BYReady*" | wc -l)

          if [ "$EXISTING_COUNT" -eq 0 ]; then
            TAG_NAME="${BRANCH_NAME}-BYReady"
          else
            TAG_NAME="${BRANCH_NAME}-BYReady${EXISTING_COUNT}"
          fi

          echo "Creating tag: $TAG_NAME"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      # Re-checkout for GitHub App authentication flow
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Get branch name
        id: branch
        run: |
          echo "name=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT

      - name: Generate Vendor GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.VENDOR_APP_ID }}
          private-key: ${{ secrets.VENDOR_APP_PRIVATE_KEY }}
          owner: guptadiya
          repositories: sync-test-prod-15-01

      - name: Configure Git identity
        run: |
          git config --global user.name "repo-sync-bot"
          git config --global user.email "repo-sync-bot@users.noreply.github.com"

      - name: Configure vendor remote
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git remote add vendor \
            "https://x-access-token:${TOKEN}@github.com/guptadiya/sync-test-prod-15-01.git"

      # Remove workflow BEFORE syncing to vendor
      - name: Remove internal workflow file
        run: |
          rm -f .github/workflows/main-repo-sync.yml

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Remove internal workflow before vendor sync"
          fi

      - name: Check if branch exists in vendor repo
        id: branch_check
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"

          if git ls-remote --heads vendor "$BRANCH" | grep -q "$BRANCH"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create vendor branch if missing
        if: steps.branch_check.outputs.exists == 'false'
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          git push vendor "HEAD:refs/heads/$BRANCH"

      - name: Sync source branch to vendor branch
        if: steps.branch_check.outputs.exists == 'true'
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          git push vendor "HEAD:refs/heads/$BRANCH" --force

      - name: Create PR in vendor repo
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"

          PR_TITLE="[ABC PR #${SOURCE_PR_NUMBER}] ${SOURCE_PR_TITLE}"

          echo "Source PR Number: ${SOURCE_PR_NUMBER}"
          echo "Source PR Title: ${SOURCE_PR_TITLE}"
          echo "Vendor PR Title: ${PR_TITLE}"

          EXISTING_PR=$(gh pr list \
            --repo guptadiya/sync-test-prod-15-01 \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR"
            exit 0
          fi

          gh pr create \
            --repo guptadiya/sync-test-prod-15-01 \
            --base "${{ github.event.pull_request.base.ref }}" \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "${{ github.event.pull_request.body }}"
